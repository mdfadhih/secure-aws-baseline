name: terraform-destroy

# Manual teardown of the baseline so a lab does not keep costing money.
# Runs only from main, only when you type "destroy", and still needs the environment approval.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to tear down the baseline'
        required: true
        type: string

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "~> 1.11"

jobs:
  destroy:
    name: Destroy the baseline
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Assume the scoped apply role through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-destroy-${{ github.run_id }}

      - name: Init
        working-directory: infra
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"

      - name: Destroy
        working-directory: infra
        run: terraform destroy -no-color -auto-approve -var="region=${AWS_REGION}"
